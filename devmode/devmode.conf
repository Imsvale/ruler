# Dev mode: what the dev build has instead of the committed (release) files. Applied by
# ../tools/devmode.sh when dev is checked out, undone for any other branch (see
# ../RELEASING.md). Paths from the project root.
#   remove <file>              the dev build lacks it
#   replace <file> <source>    the dev build has <source>'s content instead
#                              (skipped while <source> does not exist yet)
#   add <file> <source>        a file only the dev build has (git-ignored; found by the game
#                              at startup only)
#
# No cover yet (mod/_metadata/0.png): until there is one, the in-game upload refuses anyway.
# the warning image, shown big in place of the cover; one for all mods, in the mods folder
# (skipped where it is missing)
replace mod/_metadata/1.png ../dev.png
